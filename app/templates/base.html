<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}yt-music-analyzer{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/htmx.min.js"></script>
</head>
<body>
<nav class="nav">
  <span class="brand">yt-music-analyzer</span>
  <a href="/">Главная</a>
  <a href="/dashboard">Дашборд</a>
  <a href="/moods">Настроения</a>
  <a href="/recommendations">Рекомендации</a>
  <span class="nav-stat">
    треков: {{ totals.tracks_total }} · музыка: {{ totals.music_tracks }} ·
    проанализировано: {{ totals.analyzed }}
  </span>
</nav>
<main class="container">
{% block content %}{% endblock %}
</main>
</body>
</html>
