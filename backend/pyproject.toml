[project]
name = "yt-music-analyzer"
version = "0.1.0"
description = "Локальное web-приложение для анализа музыкальных вкусов на основе истории YouTube"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.24",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "librosa>=0.11",
    "numpy>=2.1,<2.4",
    "scikit-learn>=1.6",
    "bgutil-ytdlp-pot-provider>=1.3.1",
    "yt-dlp>=2026.8.19",
    "protobug>=1.0.0",
    "yt-dlp-ejs==0.8.0",
    "onnxruntime>=1.29.0",
    "essentia>=2.1b6.dev1438",
    "essentia-tensorflow>=2.1b6.dev1438",
]

[tool.uv.sources]
